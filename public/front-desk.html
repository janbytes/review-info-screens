<!--
  Interface for the Receptionist to manage race sessions and drivers.
  Allows creating sessions, adding/editing/removing drivers, and assigning cars.
  Requires authentication with the receptionist key.
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front Desk - Beachside Racetrack</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Font Awesome for icons in the driver management table -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <!-- TOAST NOTIFICATION: appears briefly at the bottom when an action succeeds or fails -->
  <div id="toast" class="toast"></div>

  <!-- EDIT DRIVER MODAL: shown when the pencil icon is clicked -->
  <div id="edit-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>EDIT DRIVER</h3>
      <div class="modal-fields">
        <input type="text" id="modal-name" placeholder="Driver name" autocomplete="new-password">
        <!-- Options are populated dynamically based on available cars for the session -->
        <select id="modal-car"></select>
      </div>
      <div class="modal-actions">
        <button onclick="saveModal()" class="btn btn-primary" style="flex:1">Save</button>
        <button onclick="closeModal()" class="btn btn-secondary" style="flex:1">Cancel</button>
      </div>
    </div>
  </div>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="login-wrap">
    <div>
      <p class="login-brand">Beachside Racetrack</p>
      <div class="card login-card">
        <h2>FRONT DESK LOGIN</h2>
        <input type="password" id="key" placeholder="Enter receptionist key"
          onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()" class="btn btn-primary">Log In</button>
        <p id="status-message"></p>
      </div>
    </div>
  </div>

  <!-- Main content hidden until the user successfully logs in -->
  <div id="main-content" style="display:none;">

    <div class="page-header">
      <h1>BEACHSIDE RACETRACK</h1>
      <span class="subtitle">Front Desk</span>
    </div>

    <div class="page-content">

      <h2 class="section-title">Race Sessions</h2>

      <div id="sessions-container" class="sessions-grid"></div>
    </div>

  </div>

  <script>
    const socket = io({ transports: ['websocket'] }); // Force WebSocket only - disables polling fallback

    // --- AUTHENTICATION ---
    function login() {
      const key = document.getElementById('key').value;
      document.getElementById('status-message').innerText = "Checking...";
      socket.emit('auth:check', { key: key, role: 'receptionist' });
    }

    // Show error message below the login button
    socket.on('auth:error', (data) => {
      document.getElementById('status-message').style.color = "red";
      document.getElementById('status-message').innerText = data.message;
    });

    // Hide login, show main content, and load session data
    socket.on('auth:success', (data) => {
      document.getElementById('login-section').style.display = "none";
      document.getElementById('main-content').style.display = "block";
      document.getElementById('status-message').innerText = "";
      const header = document.querySelector('.page-header');
      if (header) { header.classList.remove('line-animate'); void header.offsetWidth; header.classList.add('line-animate'); }
      // Request fresh data immediately after login
      socket.emit('request:data-refresh');
    });

    // --- SESSION MANAGEMENT ---
    function showAddCard() {
      const card = document.getElementById('add-session-card');
      if (!card || card.classList.contains('is-input')) return;
      card.classList.add('is-input');
      card.innerHTML = `
        <input type="text" id="sessionName" placeholder="Session name" onkeydown="if(event.key==='Enter') addSession()" onclick="event.stopPropagation()" style="width:100%">
        <div style="display:flex; gap:8px; width:100%" onclick="event.stopPropagation()">
          <button onclick="addSession()" class="btn btn-primary btn-sm" style="flex:1">Add</button>
          <button onclick="hideAddCard()" class="btn btn-secondary btn-sm" style="flex:1">Cancel</button>
        </div>
      `;
      setTimeout(() => { const i = document.getElementById('sessionName'); if (i) i.focus(); }, 50);
    }

    function hideAddCard() {
      const card = document.getElementById('add-session-card');
      if (!card) return;
      card.classList.remove('is-input');
      card.innerHTML = `<span class="plus">+</span><span class="label">New Session</span>`;
    }

    function addSession() {
      const input = document.getElementById('sessionName');
      if (!input) return;
      const name = input.value.trim();
      if (name) {
        socket.emit('session:add', { name });
        hideAddCard();
      } else {
        showToast('Please enter a session name.');
      }
    }

    function removeSession(id) {
      socket.emit('session:remove', { id });
    }

    // --- TOAST NOTIFICATION ---
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // --- DRIVER MANAGEMENT ---
    function addDriver(sessionId) {
      const nameInput = document.getElementById(`dName-${sessionId}`);
      const carInput = document.getElementById(`dCar-${sessionId}`);

      const driverName = nameInput.value;
      const carNumber = carInput.value;

      if (driverName) {
        socket.emit('driver:add', {
          sessionId,
          driverName,
          carNumber: carNumber ? parseInt(carNumber) : null
        });
      } else {
        showToast('Please enter a driver name.');
      }
    }
    // Clean inputs on success
    socket.on('driver:success', (data) => {
      const inputs = document.querySelectorAll('input[type="text"], input[type="number"]');
      inputs.forEach(input => {
        if (input.id !== "key") input.value = "";
      });
    });

    // --- ERROR HANDLING ---
    socket.on('driver:error', (data) => {
      showToast(data.message);
    });

    function removeDriver(sessionId, driverName) {
      socket.emit('driver:remove', { sessionId, driverName });
    }

    let editContext = null;

    // Opens the edit modal filled with the driver's current name and car.
    function startEdit(sessionId, index, driverName, driverCar, availableCars) {
      editContext = { sessionId, driverName };

      document.getElementById('modal-name').value = driverName;

      const select = document.getElementById('modal-car');
      select.innerHTML = availableCars.map(c =>
        `<option value="${c}" ${c === driverCar ? 'selected' : ''}>Car ${c}</option>`
      ).join('');

      document.getElementById('edit-modal').style.display = 'flex';
      document.getElementById('modal-name').focus();
    }

    function saveModal() {
      if (!editContext) return;
      const newName = document.getElementById('modal-name').value;
      const newCar = document.getElementById('modal-car').value;
      socket.emit('driver:edit', {
        sessionId: editContext.sessionId,
        oldName: editContext.driverName,
        newName,
        newCar: newCar ? parseInt(newCar) : null
      });
      closeModal();
    }

    function closeModal() {
      document.getElementById('edit-modal').style.display = 'none';
      editContext = null;
    }

    // --- DATA HANDLING ---
    socket.on('data:updated', (sessions) => {
      const pendingSessions = sessions.filter(s => s.status === 'pending');
      renderSessions(pendingSessions);
    });

    function renderSessions(sessions) {
      const container = document.getElementById('sessions-container');
      if (!container) return;

      container.innerHTML = sessions.map(s => {
        const isEditable = s.status === 'pending'; // Drivers can only be modified in 'pending' status.
        const takenCars = s.drivers.map(d => d.car);
        const allCars = [1, 2, 3, 4, 5, 6, 7, 8];
        const freeCars = allCars.filter(c => !takenCars.includes(c));

        return `
        <div class="card session-card${s.status === 'pending' ? ' session-pending' : ''}">
          <div class="session-card-header">
            <span class="session-name">${s.name}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge">${s.status.toUpperCase()}</span>
              ${isEditable ? `<button onclick="removeSession(${s.id})" class="btn btn-danger btn-sm">✕</button>` : ''}
            </div>
          </div>

          ${s.drivers.length > 0 ? `
            <table class="driver-table">
              <tbody>
                ${s.drivers.map((d, dIndex) => `
                  <tr id="driver-row-${s.id}-${dIndex}">
                    <td>${d.name}</td>
                    <td style="color: var(--text-muted)">Car #${d.car}</td>
                    <td>
                      ${isEditable ? `
                        <div class="driver-actions">
                          <button onclick="startEdit(${s.id}, ${dIndex}, '${d.name}', ${d.car}, [${[...freeCars, d.car].sort((a, b) => a - b).join(',')}])" class="btn btn-secondary btn-sm" title="Edit"><i class="fa-solid fa-pencil"></i></button>
                          <button onclick="removeDriver(${s.id}, '${d.name}')" class="btn btn-danger btn-sm" title="Remove"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                      ` : ''}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : `<p class="no-drivers">No drivers yet.</p>`}

          ${isEditable ? `
            ${freeCars.length > 0 ? `
              <p class="available-cars">Available cars: ${freeCars.join(', ')}</p>
              <div class="add-driver-form">
                <input type="text" id="dName-${s.id}" placeholder="Driver name" onkeydown="if(event.key==='Enter') addDriver(${s.id})">
                <select id="dCar-${s.id}">
                  <option value="">Auto</option>
                  ${freeCars.map(c => `<option value="${c}">Car ${c}</option>`).join('')}
                </select>
                <button onclick="addDriver(${s.id})" class="btn btn-primary btn-sm">Add</button>
              </div>
            ` : '<p class="locked-msg">All cars assigned.</p>'}
          ` : '<p class="locked-msg">Registration locked — race is active.</p>'}
        </div>
        `;
      }).join('');

      // Add the "+ New Session" button at the end of the sessions grid
      const ghost = document.createElement('div');
      ghost.id = 'add-session-card';
      ghost.className = 'add-session-card';
      ghost.setAttribute('onclick', 'showAddCard()');
      ghost.innerHTML = `<span class="plus">+</span><span class="label">New Session</span>`;
      container.appendChild(ghost);
    }

  </script>
</body>

</html>
