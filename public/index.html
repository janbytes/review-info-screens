<!--
  Main hub page: lists all available pages for staff and public displays.
  No authentication required. Opens each page in a new tab.
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beachside Racetrack Hub</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="page-hub">
  <div class="hub-card">
    <h1 class="hub-title">
      <span class="line1">BEACHSIDE</span>
      <span class="line2-row">
        <span class="line2">RACETRACK</span>
        <span class="system-hub-label">SYSTEM HUB</span>
      </span>
    </h1>

    <p class="group-label">Staff</p>
    <a href="/front-desk" class="nav-link" target="_blank">Front Desk</a>
    <a href="/race-control" class="nav-link" target="_blank">Race Control</a>
    <a href="/lap-line-tracker" class="nav-link" target="_blank">Lap-line Tracker</a>

    <hr class="divider">

    <p class="group-label">Public Displays</p>
    <a href="/leader-board" class="nav-link" target="_blank">Leaderboard</a>
    <a href="/next-race" class="nav-link" target="_blank">Next Race</a>
    <a href="/race-countdown" class="nav-link" target="_blank">Race Countdown</a>
    <a href="/race-flags" class="nav-link" target="_blank">Race Flags</a>
  </div>

  <script>
    // Trigger line animation on page load and when navigating back to the page
    function triggerLineAnimation() {
      const title = document.querySelector('.hub-title');
      title.classList.remove('line-animate');
      void title.offsetWidth; // force reflow to restart animation
      title.classList.add('line-animate');
    }

    triggerLineAnimation();
    window.addEventListener('pageshow', triggerLineAnimation);
  </script>
</body>

</html>
